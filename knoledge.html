<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KnowledgeHub Pro - Professional Information Portal & CMS</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        primary: {
                            50: '#eef2ff',
                            100: '#e0e7ff',
                            500: '#6366f1',
                            600: '#4f46e5',
                            700: '#4338ca',
                            850: '#1e1b4b',
                            900: '#312e81'
                        }
                    }
                }
            }
        }
    </script>

    <!-- React 18 & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    
    <!-- Babel Standalone for JSX compilation -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <!-- Inter Font -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
        /* Custom scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #f1f5f9;
        }
        ::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 antialiased min-h-screen flex flex-col selection:bg-indigo-500 selection:text-white">
    <!-- Root Container -->
    <div id="root" class="flex-grow flex flex-col"></div>

    <!-- Application Script -->
    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;

        const initialArticles = [
            {
                id: 1,
                title: "Architecting Scalable RESTful APIs with Laravel 11",
                slug: "architecting-scalable-restful-apis-laravel-11",
                excerpt: "Explore best practices for designing robust, secure, and performant REST endpoints using Laravel's latest architectural improvements.",
                content: `Laravel 11 introduces a streamlined application structure and powerful tools for building enterprise-grade RESTful APIs. In this comprehensive guide, we examine dependency injection, Form Requests for robust validation, API Resource transformers, and rate limiting strategies.\n\n### Modern Request Lifecycle\nWhen building decoupled architectures, ensuring uniform JSON responses is critical. By leveraging Laravel's API Resources, developers can easily shape nested relationships and conditional attributes without exposing sensitive database models.\n\n### Security & Sanctum\nAuthentication remains paramount. Laravel Sanctum provides a featherweight token-based auth system that is both easy to configure and secure against common vulnerabilities like CSRF in SPA integrations.`,
                category: "Backend Development",
                author: "Dr. Alexander Wright",
                authorRole: "Principal Systems Architect",
                date: "October 3, 2026",
                image: "https://images.unsplash.com/photo-1555066931-4365d14bab8c?auto=format&fit=crop&w=1200&q=80",
                views: 3420,
                status: "Published",
                featured: true
            },
            {
                id: 2,
                title: "Mastering React Component Composition & State Patterns",
                slug: "mastering-react-component-composition-state-patterns",
                excerpt: "Learn how to avoid prop drilling and construct highly maintainable component hierarchies using compound components and custom hooks.",
                content: `As frontend applications scale, state management can quickly become a bottleneck. While Redux and Zustand offer global stores, mastering React's built-in composition patterns often eliminates the need for external libraries in modular feature sets.\n\n### The Power of Children & Slots\nPassing JSX elements directly through props or children allows components to remain agnostic of their exact children, enhancing reusability across diverse UI modules.`,
                category: "Frontend Engineering",
                author: "Sarah Jenkins",
                authorRole: "Lead Frontend Engineer",
                date: "October 1, 2026",
                image: "https://images.unsplash.com/photo-1633356122544-f134324a6cee?auto=format&fit=crop&w=1200&q=80",
                views: 2890,
                status: "Published",
                featured: true
            },
            {
                id: 3,
                title: "MySQL Performance Optimization & Indexing Strategies",
                slug: "mysql-performance-optimization-indexing-strategies",
                excerpt: "Discover how proper composite indexing, query execution plan analysis, and connection pooling can accelerate database response times.",
                content: `Database latency is frequently the silent killer of web application performance. Analyzing slow query logs and utilizing EXPLAIN statements can reveal missing indexes on foreign keys and high-frequency lookup columns.\n\n### B-Tree Indexes vs Hash Indexes\nUnderstanding how storage engines organize data structures helps database administrators design schemas that scale gracefully past millions of rows.`,
                category: "Database Administration",
                author: "Marcus Vance",
                authorRole: "Senior Database Reliability Engineer",
                date: "September 28, 2026",
                image: "https://images.unsplash.com/photo-1544383835-bda2bc66a55d?auto=format&fit=crop&w=1200&q=80",
                views: 1950,
                status: "Published",
                featured: false
            },
            {
                id: 4,
                title: "Enterprise Cybersecurity: Zero Trust Architecture in 2026",
                slug: "enterprise-cybersecurity-zero-trust-architecture-2026",
                excerpt: "An in-depth analysis of implementing strict identity verification, micro-segmentation, and least-privilege access across distributed enterprise clouds.",
                content: `The perimeter-based security model is obsolete. Modern enterprises must adopt a Zero Trust framework where no user or device is trusted implicitly, regardless of whether they reside inside or outside the corporate firewall.\n\n### Continuous Verification\nBy enforcing contextual multi-factor authentication and device posture assessment in real-time, security teams can neutralize lateral movement during breach attempts.`,
                category: "Cybersecurity",
                author: "Elena Rostova",
                authorRole: "Chief Information Security Officer",
                date: "September 25, 2026",
                image: "https://images.unsplash.com/photo-1563986768609-322da13575f3?auto=format&fit=crop&w=1200&q=80",
                views: 4120,
                status: "Published",
                featured: true
            },
            {
                id: 5,
                title: "Cloud Native Deployment Pipelines with Docker & Kubernetes",
                slug: "cloud-native-deployment-pipelines-docker-kubernetes",
                excerpt: "Streamline continuous integration and zero-downtime rolling updates using containerized microservices orchestrated via Kubernetes clusters.",
                content: `Containerization has transformed software delivery. This article breaks down multi-stage Dockerfiles, Helm chart configurations, and GitOps workflows powered by ArgoCD.\n\n### High Availability Pods\nConfiguring liveness and readiness probes ensures that traffic is never routed to unhealthy application instances during heavy traffic surges.`,
                category: "DevOps & Cloud",
                author: "David Kim",
                authorRole: "DevOps Lead",
                date: "September 20, 2026",
                image: "https://images.unsplash.com/photo-1618401471353-b98aedd04e11?auto=format&fit=crop&w=1200&q=80",
                views: 1640,
                status: "Published",
                featured: false
            },
            {
                id: 6,
                title: "UX Psychology: Designing Intuitive Enterprise Dashboards",
                slug: "ux-psychology-designing-intuitive-enterprise-dashboards",
                excerpt: "Explore cognitive load theories, information hierarchy, and color theory principles to create data-dense dashboards that users love.",
                content: `Enterprise software often suffers from cognitive overload. By applying Gestalt principles of visual perception, designers can group related telemetry data and guide user attention to critical system anomalies instantly.\n\n### Progressive Disclosure\nShowing summary metrics upfront while allowing deep drill-downs on demand keeps interfaces clean and actionable.`,
                category: "UI/UX Design",
                author: "Chloe Bennett",
                authorRole: "Head of Product Design",
                date: "September 15, 2026",
                image: "https://images.unsplash.com/photo-1507238691740-187a5b1d37b8?auto=format&fit=crop&w=1200&q=80",
                views: 2230,
                status: "Draft",
                featured: false
            }
        ];

        const initialCategories = [
            { id: 1, name: "Backend Development", slug: "backend-development", count: 12, description: "Server-side architectures, APIs, and frameworks." },
            { id: 2, name: "Frontend Engineering", slug: "frontend-engineering", count: 18, description: "Modern UI frameworks, performance, and accessibility." },
            { id: 3, name: "Database Administration", slug: "database-administration", count: 8, description: "SQL tuning, NoSQL data stores, and replication." },
            { id: 4, name: "Cybersecurity", slug: "cybersecurity", count: 9, description: "Threat intelligence, encryption, and compliance." },
            { id: 5, name: "DevOps & Cloud", slug: "devops-cloud", count: 14, description: "CI/CD pipelines, containerization, and serverless." },
            { id: 6, name: "UI/UX Design", slug: "ui-ux-design", count: 7, description: "Design systems, user research, and interaction design." }
        ];

        const initialUsers = [
            { id: 1, name: "Dr. Alexander Wright", email: "alexander@knowledgehub.io", role: "Super Admin", status: "Active" },
            { id: 2, name: "Sarah Jenkins", email: "sarah@knowledgehub.io", role: "Editor", status: "Active" },
            { id: 3, name: "Marcus Vance", email: "marcus@knowledgehub.io", role: "Author", status: "Active" },
            { id: 4, name: "Elena Rostova", email: "elena@knowledgehub.io", role: "Author", status: "Inactive" }
        ];

        const initialSettings = {
            siteTitle: "KnowledgeHub Pro",
            siteTagline: "Professional Information Portal & Enterprise CMS",
            contactEmail: "support@knowledgehub.io",
            supportPhone: "+1 (800) 555-KNOW",
            maintenanceMode: false,
            allowRegistration: true,
            postsPerPage: 6
        };

        function App() {
            // Navigation & View States
            const [currentView, setCurrentView] = useState('home'); // 'home', 'articles', 'article-detail', 'categories', 'search', 'admin'
            const [selectedArticleId, setSelectedArticleId] = useState(null);
            const [selectedCategory, setSelectedCategory] = useState(null);
            const [searchQuery, setSearchQuery] = useState('');
            
            // CMS Data States
            const [articles, setArticles] = useState(initialArticles);
            const [categories, setCategories] = useState(initialCategories);
            const [users, setUsers] = useState(initialUsers);
            const [settings, setSettings] = useState(initialSettings);
            
            // Auth State for Admin
            const [isAdminLoggedIn, setIsAdminLoggedIn] = useState(false);
            const [adminUser, setAdminUser] = useState({ name: 'Admin User', email: 'admin@knowledgehub.io' });

            // UI feedback state
            const [toast, setToast] = useState(null);

            const showToast = (message, type = 'success') => {
                setToast({ message, type });
                setTimeout(() => setToast(null), 3500);
            };

            // Re-initialize Lucide icons on view changes
            useEffect(() => {
                if (window.lucide) {
                    window.lucide.createIcons();
                }
            }, [currentView, selectedArticleId, articles]);

            // Helper to navigate & scroll top
            const navigateTo = (view, articleId = null, categorySlug = null) => {
                setCurrentView(view);
                if (articleId) setSelectedArticleId(articleId);
                if (categorySlug) setSelectedCategory(categorySlug);
                window.scrollTo({ top: 0, behavior: 'smooth' });
            };

            // CRUD Handlers for Articles
            const handleSaveArticle = (articleData) => {
                if (articleData.id) {
                    setArticles(articles.map(a => a.id === articleData.id ? articleData : a));
                    showToast("Article updated successfully via REST API!");
                } else {
                    const newArticle = {
                        ...articleData,
                        id: Date.now(),
                        slug: articleData.title.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/(^-|-$)/g, ''),
                        views: 12,
                        date: new Date().toLocaleDateString('en-US', { month: 'long', day: 'numeric', year: 'numeric' })
                    };
                    setArticles([newArticle, ...articles]);
                    showToast("New article created successfully via REST API!");
                }
            };

            const handleDeleteArticle = (id) => {
                if (confirm("Are you sure you want to delete this article?")) {
                    setArticles(articles.filter(a => a.id !== id));
                    showToast("Article deleted successfully.", "error");
                }
            };

            const handleTogglePublish = (id) => {
                setArticles(articles.map(a => {
                    if (a.id === id) {
                        const newStatus = a.status === 'Published' ? 'Draft' : 'Published';
                        showToast(`Article status updated to ${newStatus}`);
                        return { ...a, status: newStatus };
                    }
                    return a;
                }));
            };

            return (
                <div className="flex flex-col min-h-screen">
                    {/* Toast Notification Banner */}
                    {toast && (
                        <div className={`fixed bottom-5 right-5 z-50 px-5 py-3 rounded-xl shadow-xl text-white font-medium flex items-center space-x-3 transition-all duration-300 animate-bounce ${
                            toast.type === 'error' ? 'bg-rose-600' : 'bg-emerald-600'
                        }`}>
                            <i data-lucide={toast.type === 'error' ? 'alert-circle' : 'check-circle-2'} className="w-5 h-5"></i>
                            <span>{toast.message}</span>
                        </div>
                    )}

                    {/* Navigation Bar */}
                    <Navbar 
                        currentView={currentView} 
                        navigateTo={navigateTo} 
                        searchQuery={searchQuery}
                        setSearchQuery={setSearchQuery}
                        isAdminLoggedIn={isAdminLoggedIn}
                        settings={settings}
                    />

                    {/* Main Content Area */}
                    <main className="flex-grow">
                        {currentView === 'home' && (
                            <HomeView 
                                articles={articles} 
                                categories={categories} 
                                navigateTo={navigateTo}
                            />
                        )}

                        {currentView === 'articles' && (
                            <ArticlesView 
                                articles={articles} 
                                categories={categories}
                                navigateTo={navigateTo}
                            />
                        )}

                        {currentView === 'article-detail' && (
                            <ArticleDetailView 
                                articleId={selectedArticleId}
                                articles={articles}
                                navigateTo={navigateTo}
                                showToast={showToast}
                            />
                        )}

                        {currentView === 'categories' && (
                            <CategoriesView 
                                categories={categories}
                                articles={articles}
                                selectedCategory={selectedCategory}
                                setSelectedCategory={setSelectedCategory}
                                navigateTo={navigateTo}
                            />
                        )}

                        {currentView === 'search' && (
                            <SearchView 
                                articles={articles}
                                categories={categories}
                                initialQuery={searchQuery}
                                navigateTo={navigateTo}
                            />
                        )}

                        {currentView === 'admin' && (
                            <AdminDashboard 
                                isAdminLoggedIn={isAdminLoggedIn}
                                setIsAdminLoggedIn={setIsAdminLoggedIn}
                                adminUser={adminUser}
                                setAdminUser={setAdminUser}
                                articles={articles}
                                onSaveArticle={handleSaveArticle}
                                onDeleteArticle={handleDeleteArticle}
                                onTogglePublish={handleTogglePublish}
                                categories={categories}
                                setCategories={setCategories}
                                users={users}
                                setUsers={setUsers}
                                settings={settings}
                                setSettings={setSettings}
                                showToast={showToast}
                                navigateTo={navigateTo}
                            />
                        )}
                    </main>

                    {/* Professional Footer (Hidden on Admin screen for full workspace) */}
                    {currentView !== 'admin' && (
                        <Footer navigateTo={navigateTo} settings={settings} />
                    )}
                </div>
            );
        }

        function Navbar({ currentView, navigateTo, searchQuery, setSearchQuery, isAdminLoggedIn, settings }) {
            const [mobileMenuOpen, setMobileMenuOpen] = useState(false);
            const [localSearch, setLocalSearch] = useState(searchQuery);

            const handleSearchSubmit = (e) => {
                e.preventDefault();
                if (localSearch.trim()) {
                    setSearchQuery(localSearch);
                    navigateTo('search');
                    setMobileMenuOpen(false);
                }
            };

            return (
                <header className="sticky top-0 z-40 bg-white/90 backdrop-blur-md border-b border-slate-200 shadow-sm">
                    <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
                        <div className="flex items-center justify-between h-20">
                            {/* Logo */}
                            <div className="flex items-center space-x-3 cursor-pointer" onClick={() => navigateTo('home')}>
                                <div className="w-11 h-11 bg-indigo-600 rounded-xl flex items-center justify-center text-white shadow-md shadow-indigo-200">
                                    <i data-lucide="book-open" className="w-6 h-6"></i>
                                </div>
                                <div>
                                    <span className="text-xl font-bold tracking-tight text-slate-900">{settings.siteTitle}</span>
                                    <span className="block text-xs font-medium text-indigo-600 uppercase tracking-widest">Enterprise Portal</span>
                                </div>
                            </div>

                            {/* Desktop Navigation Links */}
                            <nav className="hidden md:flex items-center space-x-8">
                                <button 
                                    onClick={() => navigateTo('home')}
                                    className={`font-medium transition-colors hover:text-indigo-600 ${currentView === 'home' ? 'text-indigo-600 font-semibold' : 'text-slate-600'}`}
                                >
                                    Home
                                </button>
                                <button 
                                    onClick={() => navigateTo('articles')}
                                    className={`font-medium transition-colors hover:text-indigo-600 ${currentView === 'articles' ? 'text-indigo-600 font-semibold' : 'text-slate-600'}`}
                                >
                                    Articles & Docs
                                </button>
                                <button 
                                    onClick={() => navigateTo('categories')}
                                    className={`font-medium transition-colors hover:text-indigo-600 ${currentView === 'categories' ? 'text-indigo-600 font-semibold' : 'text-slate-600'}`}
                                >
                                    Categories
                                </button>
                            </nav>

                            {/* Search and Admin CTA */}
                            <div className="hidden lg:flex items-center space-x-4">
                                <form onSubmit={handleSearchSubmit} className="relative">
                                    <input 
                                        type="text" 
                                        placeholder="Search articles..."
                                        value={localSearch}
                                        onChange={(e) => setLocalSearch(e.target.value)}
                                        className="w-56 pl-10 pr-4 py-2 bg-slate-100 rounded-xl text-sm border border-transparent focus:border-indigo-500 focus:bg-white focus:outline-none transition-all"
                                    />
                                    <i data-lucide="search" className="w-4 h-4 text-slate-400 absolute left-3 top-3"></i>
                                </form>

                                <button 
                                    onClick={() => navigateTo('admin')}
                                    className={`px-4 py-2.5 rounded-xl font-medium text-sm flex items-center space-x-2 transition-all shadow-sm ${
                                        currentView === 'admin' 
                                            ? 'bg-slate-900 text-white' 
                                            : 'bg-indigo-50 text-indigo-700 hover:bg-indigo-100 border border-indigo-200'
                                    }`}
                                >
                                    <i data-lucide="layout-dashboard" className="w-4 h-4"></i>
                                    <span>{isAdminLoggedIn ? 'Admin Panel' : 'CMS Login'}</span>
                                </button>
                            </div>

                            {/* Mobile Hamburger Button */}
                            <div className="flex md:hidden items-center space-x-3">
                                <button 
                                    onClick={() => navigateTo('admin')}
                                    className="p-2.5 rounded-xl bg-indigo-50 text-indigo-700 hover:bg-indigo-100"
                                    title="Admin Dashboard"
                                >
                                    <i data-lucide="layout-dashboard" className="w-5 h-5"></i>
                                </button>
                                <button 
                                    onClick={() => setMobileMenuOpen(!mobileMenuOpen)}
                                    className="p-2.5 rounded-xl bg-slate-100 text-slate-700 hover:bg-slate-200"
                                >
                                    <i data-lucide={mobileMenuOpen ? "x" : "menu"} className="w-6 h-6"></i>
                                </button>
                            </div>
                        </div>
                    </div>

                    {/* Mobile Dropdown Menu */}
                    {mobileMenuOpen && (
                        <div className="md:hidden bg-white border-b border-slate-200 px-6 py-5 space-y-4 shadow-xl">
                            <form onSubmit={handleSearchSubmit} className="relative">
                                <input 
                                    type="text" 
                                    placeholder="Search knowledge base..."
                                    value={localSearch}
                                    onChange={(e) => setLocalSearch(e.target.value)}
                                    className="w-full pl-10 pr-4 py-2.5 bg-slate-100 rounded-xl text-sm border border-transparent focus:border-indigo-500 focus:bg-white focus:outline-none"
                                />
                                <i data-lucide="search" className="w-4 h-4 text-slate-400 absolute left-3 top-3.5"></i>
                            </form>
                            <div className="flex flex-col space-y-3 pt-2">
                                <button 
                                    onClick={() => { navigateTo('home'); setMobileMenuOpen(false); }}
                                    className="text-left font-medium text-slate-700 hover:text-indigo-600 py-2 border-b border-slate-100"
                                >
                                    Home
                                </button>
                                <button 
                                    onClick={() => { navigateTo('articles'); setMobileMenuOpen(false); }}
                                    className="text-left font-medium text-slate-700 hover:text-indigo-600 py-2 border-b border-slate-100"
                                >
                                    Articles & Docs
                                </button>
                                <button 
                                    onClick={() => { navigateTo('categories'); setMobileMenuOpen(false); }}
                                    className="text-left font-medium text-slate-700 hover:text-indigo-600 py-2 border-b border-slate-100"
                                >
                                    Categories
                                </button>
                                <button 
                                    onClick={() => { navigateTo('admin'); setMobileMenuOpen(false); }}
                                    className="w-full py-3 bg-indigo-600 text-white rounded-xl font-medium text-center shadow-md flex items-center justify-center space-x-2"
                                >
                                    <i data-lucide="layout-dashboard" className="w-4 h-4"></i>
                                    <span>Admin Dashboard / CMS</span>
                                </button>
                            </div>
                        </div>
                    )}
                </header>
            );
        }

        function HomeView({ articles, categories, navigateTo }) {
            const publishedArticles = articles.filter(a => a.status === 'Published');
            const featuredArticles = publishedArticles.filter(a => a.featured);
            const latestArticles = publishedArticles.slice(0, 4);

            return (
                <div className="space-y-16 pb-20">
                    {/* Modern Hero Section */}
                    <section className="relative bg-gradient-to-br from-indigo-900 via-slate-900 to-slate-950 text-white py-24 px-4 sm:px-6 lg:px-8 overflow-hidden">
                        <div className="absolute inset-0 opacity-10 bg-[radial-gradient(#6366f1_1px,transparent_1px)] [background-size:16px_16px]"></div>
                        <div className="max-w-5xl mx-auto text-center relative z-10 space-y-8">
                            <div className="inline-flex items-center space-x-2 px-4 py-2 rounded-full bg-indigo-500/20 border border-indigo-400/30 text-indigo-300 text-sm font-medium backdrop-blur-md">
                                <i data-lucide="sparkles" className="w-4 h-4"></i>
                                <span>Powered by Laravel REST API & React.js</span>
                            </div>
                            <h1 className="text-4xl sm:text-6xl font-extrabold tracking-tight leading-tight">
                                Enterprise Knowledge & <span className="text-transparent bg-clip-text bg-gradient-to-r from-indigo-400 to-emerald-400">Professional Insights</span>
                            </h1>
                            <p className="text-lg sm:text-xl text-slate-300 max-w-3xl mx-auto leading-relaxed font-light">
                                Access peer-reviewed documentation, engineering articles, security advisories, and system architectures managed seamlessly through our secure CMS platform.
                            </p>
                            <div className="flex flex-col sm:flex-row items-center justify-center gap-4 pt-4">
                                <button 
                                    onClick={() => navigateTo('articles')}
                                    className="w-full sm:w-auto px-8 py-4 bg-indigo-600 hover:bg-indigo-500 text-white rounded-2xl font-semibold shadow-lg shadow-indigo-600/30 transition-all transform hover:-translate-y-0.5 flex items-center justify-center space-x-3"
                                >
                                    <span>Explore Articles</span>
                                    <i data-lucide="arrow-right" className="w-5 h-5"></i>
                                </button>
                                <button 
                                    onClick={() => navigateTo('admin')}
                                    className="w-full sm:w-auto px-8 py-4 bg-white/10 hover:bg-white/20 text-white border border-white/20 rounded-2xl font-semibold backdrop-blur-md transition-all flex items-center justify-center space-x-3"
                                >
                                    <i data-lucide="layout-dashboard" className="w-5 h-5"></i>
                                    <span>Admin CMS Dashboard</span>
                                </button>
                            </div>
                        </div>
                    </section>

                    {/* Featured Information / Articles Section */}
                    <section className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
                        <div className="flex items-center justify-between mb-8">
                            <div>
                                <h2 className="text-2xl sm:text-3xl font-bold text-slate-900 tracking-tight">Featured Information</h2>
                                <p className="text-slate-500 text-sm mt-1">Curated expert guides and architecture whitepapers</p>
                            </div>
                            <button 
                                onClick={() => navigateTo('articles')}
                                className="text-indigo-600 hover:text-indigo-700 font-semibold text-sm flex items-center space-x-1 group"
                            >
                                <span>View all articles</span>
                                <i data-lucide="chevron-right" className="w-4 h-4 transition-transform group-hover:translate-x-1"></i>
                            </button>
                        </div>

                        <div className="grid grid-cols-1 md:grid-cols-3 gap-8">
                            {featuredArticles.slice(0, 3).map(article => (

                                        </td>
                                    </tr>
                                ))}
                            </tbody>
                        </table>
                    </div>
                </div>
            );
        }

        function AdminUsers({ users, setUsers, showToast }) {
            const [name, setName] = useState('');
            const [email, setEmail] = useState('');
            const [role, setRole] = useState('Editor');

            const handleAddUser = (e) => {
                e.preventDefault();
                if (name && email) {
                    const newUser = {
                        id: Date.now(),
                        name,
                        email,
                        role,
                        status: 'Active'
                    };
                    setUsers([...users, newUser]);
                    setName('');
                    setEmail('');
                    showToast("New user added successfully!");
                }
            };

            return (
                <div className="space-y-6">
                    <div>
                        <h2 className="text-2xl font-bold text-slate-900 tracking-tight">User & Admin Management</h2>
                        <p className="text-slate-500 text-sm">Control role permissions and access control lists</p>
                    </div>

                    <form onSubmit={handleAddUser} className="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm grid grid-cols-1 sm:grid-cols-4 gap-4">
                        <input 
                            type="text" 
                            placeholder="Full Name"
                            required
                            value={name}
                            onChange={(e) => setName(e.target.value)}
                            className="px-4 py-2.5 rounded-xl border border-slate-200 text-sm focus:outline-none focus:border-indigo-500"
                        />
                        <input 
                            type="email" 
                            placeholder="Email Address"
                            required
                            value={email}
                            onChange={(e) => setEmail(e.target.value)}
                            className="px-4 py-2.5 rounded-xl border border-slate-200 text-sm focus:outline-none focus:border-indigo-500"
                        />
                        <select 
                            value={role}
                            onChange={(e) => setRole(e.target.value)}
                            className="px-4 py-2.5 rounded-xl border border-slate-200 text-sm focus:outline-none focus:border-indigo-500 bg-white"
                        >
                            <option value="Super Admin">Super Admin</option>
                            <option value="Editor">Editor</option>
                            <option value="Author">Author</option>
                        </select>
                        <button 
                            type="submit"
                            className="px-6 py-2.5 bg-indigo-600 text-white rounded-xl text-sm font-semibold hover:bg-indigo-500 shadow-md"
                        >
                            Add User
                        </button>
                    </form>

                    <div className="bg-white rounded-2xl border border-slate-200 shadow-sm overflow-hidden">
                        <table className="w-full text-left border-collapse">
                            <thead>
                                <tr className="bg-slate-50 border-b border-slate-200 text-slate-400 text-xs font-semibold uppercase tracking-wider">
                                    <th className="py-4 px-6">Name</th>
                                    <th className="py-4 px-6">Email</th>
                                    <th className="py-4 px-6">Role</th>
                                    <th className="py-4 px-6">Status</th>
                                </tr>
                            </thead>
                            <tbody className="divide-y divide-slate-100 text-sm text-slate-700">
                                {users.map(u => (
                                    <tr key={u.id} className="hover:bg-slate-50">
                                        <td className="py-4 px-6 font-semibold text-slate-900">{u.name}</td>
                                        <td className="py-4 px-6 text-slate-500">{u.email}</td>
                                        <td className="py-4 px-6">
                                            <span className="px-3 py-1 bg-indigo-50 text-indigo-700 rounded-full text-xs font-semibold">
                                                {u.role}
                                            </span>
                                        </td>
                                        <td className="py-4 px-6">
                                            <span className={`px-3 py-1 rounded-full text-xs font-semibold ${u.status === 'Active' ? 'bg-emerald-100 text-emerald-700' : 'bg-slate-100 text-slate-600'}`}>
                                                {u.status}
                                            </span>
                                        </td>
                                    </tr>
                                ))}
                            </tbody>
                        </table>
                    </div>
                </div>
            );
        }

        function AdminSettings({ settings, setSettings, showToast }) {
            const [form, setForm] = useState(settings);

            const handleChange = (e) => {
                const { name, value, type, checked } = e.target;
                setForm({ ...form, [name]: type === 'checkbox' ? checked : value });
            };

            const handleSubmit = (e) => {
                e.preventDefault();
                setSettings(form);
                showToast("Website settings updated successfully!");
            };

            return (
                <div className="space-y-6">
                    <div>
                        <h2 className="text-2xl font-bold text-slate-900 tracking-tight">Website Settings</h2>
                        <p className="text-slate-500 text-sm">Configure global portal parameters and SEO metadata</p>
                    </div>

                    <form onSubmit={handleSubmit} className="bg-white p-8 rounded-3xl border border-slate-200 shadow-sm space-y-6 max-w-2xl">
                        <div className="space-y-1.5">
                            <label className="text-xs font-semibold text-slate-700 uppercase">Site Title</label>
                            <input 
                                type="text" 
                                name="siteTitle"
                                value={form.siteTitle}
                                onChange={handleChange}
                                className="w-full px-4 py-3 rounded-xl border border-slate-200 text-sm focus:outline-none focus:border-indigo-500"
                            />
                        </div>

                        <div className="space-y-1.5">
                            <label className="text-xs font-semibold text-slate-700 uppercase">Site Tagline</label>
                            <input 
                                type="text" 
                                name="siteTagline"
                                value={form.siteTagline}
                                onChange={handleChange}
                                className="w-full px-4 py-3 rounded-xl border border-slate-200 text-sm focus:outline-none focus:border-indigo-500"
                            />
                        </div>

                        <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                            <div className="space-y-1.5">
                                <label className="text-xs font-semibold text-slate-700 uppercase">Support Email</label>
                                <input 
                                    type="email" 
                                    name="contactEmail"
                                    value={form.contactEmail}
                                    onChange={handleChange}
                                    className="w-full px-4 py-3 rounded-xl border border-slate-200 text-sm focus:outline-none focus:border-indigo-500"
                                />
                            </div>
                            <div className="space-y-1.5">
                                <label className="text-xs font-semibold text-slate-700 uppercase">Support Phone</label>
                                <input 
                                    type="text" 
                                    name="supportPhone"
                                    value={form.supportPhone}
                                    onChange={handleChange}
                                    className="w-full px-4 py-3 rounded-xl border border-slate-200 text-sm focus:outline-none focus:border-indigo-500"
                                />
                            </div>
                        </div>

                        <div className="pt-4 flex justify-end">
                            <button 
                                type="submit"
                                className="px-6 py-3 bg-indigo-600 hover:bg-indigo-500 text-white rounded-xl text-sm font-semibold shadow-md shadow-indigo-200"
                            >
                                Save Settings
                            </button>
                        </div>
                    </form>
                </div>
            );
        }

        function Footer({ navigateTo, settings }) {
            return (
                <footer className="bg-slate-900 text-slate-400 py-16 border-t border-slate-800">
                    <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 grid grid-cols-1 md:grid-cols-4 gap-12">
                        <div className="space-y-4">
                            <div className="flex items-center space-x-3 text-white">
                                <div className="w-9 h-9 bg-indigo-600 rounded-xl flex items-center justify-center font-bold">
                                    <i data-lucide="book-open" className="w-5 h-5"></i>
                                </div>
                                <span className="font-bold text-lg">{settings.siteTitle}</span>
                            </div>
                            <p className="text-sm text-slate-400 leading-relaxed">
                                {settings.siteTagline}
                            </p>
                        </div>

                        <div className="space-y-3">
                            <h4 className="text-white font-semibold text-sm uppercase tracking-wider">Quick Links</h4>
                            <ul className="space-y-2 text-sm">
                                <li><button onClick={() => navigateTo('home')} className="hover:text-white transition-colors">Home</button></li>
                                <li><button onClick={() => navigateTo('articles')} className="hover:text-white transition-colors">Articles & Docs</button></li>
                                <li><button onClick={() => navigateTo('categories')} className="hover:text-white transition-colors">Categories</button></li>
                                <li><button onClick={() => navigateTo('admin')} className="hover:text-white transition-colors">Admin Dashboard</button></li>
                            </ul>
                        </div>

                        <div className="space-y-3">
                            <h4 className="text-white font-semibold text-sm uppercase tracking-wider">Contact & Support</h4>
                            <p className="text-sm">{settings.contactEmail}</p>
                            <p className="text-sm">{settings.supportPhone}</p>
                            <p className="text-xs text-slate-500">Secure Laravel REST Architecture & MySQL database powered.</p>
                        </div>

                        <div className="space-y-3">
                            <h4 className="text-white font-semibold text-sm uppercase tracking-wider">Newsletter</h4>
                            <p className="text-xs text-slate-400">Subscribe for weekly engineering whitepapers.</p>
                            <div className="flex gap-2">
                                <input type="email" placeholder="Your email..." className="bg-slate-800 border border-slate-700 px-3 py-2 rounded-xl text-sm text-white w-full focus:outline-none focus:border-indigo-500" />
                                <button onClick={() => alert("Subscribed successfully!")} className="px-4 bg-indigo-600 hover:bg-indigo-500 text-white rounded-xl text-sm font-semibold">Join</button>
                            </div>
                        </div>
                    </div>
                    <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 mt-12 pt-8 border-t border-slate-800 text-center text-xs text-slate-500">
                        &copy; 2026 {settings.siteTitle}. All rights reserved. Built with React.js, Tailwind CSS & Laravel REST API architecture.
                    </div>
                </footer>
            );
        }

        // Render React Application
        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>
